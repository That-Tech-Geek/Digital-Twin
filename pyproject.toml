[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="glucose-digital-twin"
version="0.1.0"
description="Personalized glucose forecasting and hypoglycemia prediction digital twin"
requires-python=">=3.11"
dependencies=["numpy>=1.26","pandas>=2.1","scikit-learn>=1.4","torch>=2.2","streamlit>=1.36"]
[project.optional-dependencies]
research=["xgboost>=2.0","shap>=0.45","matplotlib>=3.8","pyarrow>=15"]
dev=["pytest>=8","ruff>=0.6","black>=24.8"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"
[tool.black]
line-length=100
